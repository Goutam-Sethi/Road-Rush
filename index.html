<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road Rush</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/game.css">
</head>

<body>

    <main class="game">

        <!-- Main Menu -->
        <section class="start-screen">
            <h1>ROAD RUSH</h1>

            <p>Race. Dodge. Survive.</p>

            <button class="start-btn">START RACE</button>
        </section>

        <!-- Game Screen -->
        <section class="game-screen hidden">

            <div class="hud">
                <span class="score">Score: 0</span>
                <span class="speed">Speed: 0</span>
            </div>

            <div class="road">
                <div class="player-car"></div>
            </div>

        </section>

    </main>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
