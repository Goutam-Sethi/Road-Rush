<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100%" height="100%">
  <defs>
    <!-- Cyber Lime & Cyan Gradients -->
    <linearGradient id="nBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#023020" />
      <stop offset="15%" stop-color="#05603a" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="85%" stop-color="#05603a" />
      <stop offset="100%" stop-color="#023020" />
    </linearGradient>

    <linearGradient id="nRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#012b1c" />
      <stop offset="50%" stop-color="#03482e" />
      <stop offset="100%" stop-color="#011b11" />
    </linearGradient>

    <linearGradient id="nGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01140e" />
      <stop offset="35%" stop-color="#033d2c" />
      <stop offset="60%" stop-color="#022419" />
      <stop offset="100%" stop-color="#010f0a" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="nGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Drop Shadow with Cyan Underglow hint -->
  <ellipse cx="50" cy="108" rx="43" ry="77" fill="#00e5ff" opacity="0.15" filter="url(#nGlow)" />
  <ellipse cx="50" cy="108" rx="42" ry="76" fill="#000000" opacity="0.65" />

  <!-- Tires -->
  <rect x="7" y="38" width="13" height="34" rx="4" fill="#0f1412" />
  <rect x="80" y="38" width="13" height="34" rx="4" fill="#0f1412" />
  <rect x="6" y="132" width="14" height="36" rx="4" fill="#0f1412" />
  <rect x="80" y="132" width="14" height="36" rx="4" fill="#0f1412" />

  <!-- Tire Rims (Electric Cyan) -->
  <line x1="13" y1="42" x2="13" y2="68" stroke="#00e5ff" stroke-width="2" />
  <line x1="87" y1="42" x2="87" y2="68" stroke="#00e5ff" stroke-width="2" />
  <line x1="13" y1="136" x2="13" y2="164" stroke="#00e5ff" stroke-width="2" />
  <line x1="87" y1="136" x2="87" y2="164" stroke="#00e5ff" stroke-width="2" />

  <!-- Main Chassis / Outer Silhouette -->
  <path d="M 28 16 
           C 40 13, 60 13, 72 16 
           C 84 19, 87 34, 88 52 
           C 89 68, 86 85, 84 105 
           C 87 122, 91 142, 90 166 
           C 89 184, 81 192, 72 193 
           C 60 194, 40 194, 28 193 
           C 19 192, 11 184, 10 166 
           C 9 142, 13 122, 16 105 
           C 14 85, 11 68, 12 52 
           C 13 34, 16 19, 28 16 Z" 
        fill="url(#nBodyGrad)" stroke="#012417" stroke-width="1.5" />

  <!-- Cyber Neon Circuit Accents -->
  <path d="M 30 22 L 50 35 L 70 22" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.9" filter="url(#nGlow)" />
  <line x1="50" y1="35" x2="50" y2="62" stroke="#00e5ff" stroke-width="1.5" opacity="0.8" />
  <path d="M 22 110 L 16 140 L 22 165" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.7" />
  <path d="M 78 110 L 84 140 L 78 165" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.7" />

  <!-- Hood Indentations -->
  <path d="M 36 38 L 43 58 L 38 60 Z" fill="#011a11" />
  <path d="M 64 38 L 57 58 L 62 60 Z" fill="#011a11" />

  <!-- Side Mirrors -->
  <path d="M 12 76 C 5 74, 4 82, 11 86 Z" fill="#02482e" stroke="#011b11" stroke-width="1" />
  <path d="M 88 76 C 95 74, 96 82, 89 86 Z" fill="#02482e" stroke="#011b11" stroke-width="1" />

  <!-- Front Windshield -->
  <path d="M 24 66 
           C 36 62, 64 62, 76 66 
           C 79 78, 77 94, 73 103 
           C 62 101, 38 101, 27 103 
           C 23 94, 21 78, 24 66 Z" 
        fill="url(#nGlassGrad)" stroke="#011a11" stroke-width="1.5" />

  <!-- Windshield Reflection -->
  <path d="M 28 68 Q 42 78 48 98 L 44 99 Q 38 80 26 70 Z" fill="#b9f6ca" opacity="0.4" />

  <!-- Roof Section -->
  <path d="M 27 103 
           C 38 101, 62 101, 73 103 
           C 74 116, 73 130, 71 141 
           C 60 139, 40 139, 29 141 
           C 27 130, 26 116, 27 103 Z" 
        fill="url(#nRoofGrad)" />

  <!-- Cyber Matrix Roof Line -->
  <rect x="46" y="103" width="8" height="37" fill="#01120b" rx="2" />
  <line x1="50" y1="104" x2="50" y2="139" stroke="#00e5ff" stroke-width="1.8" filter="url(#nGlow)" />

  <!-- Rear Window -->
  <path d="M 29 141 
           C 40 139, 60 139, 71 141 
           C 72 153, 70 162, 67 167 
           C 58 165, 42 165, 33 167 
           C 30 162, 28 153, 29 141 Z" 
        fill="url(#nGlassGrad)" stroke="#011a11" stroke-width="1.5" />

  <!-- Engine Heat Slats -->
  <line x1="38" y1="148" x2="62" y2="148" stroke="#011a11" stroke-width="1.5" />
  <line x1="39" y1="154" x2="61" y2="154" stroke="#011a11" stroke-width="1.5" />
  <line x1="41" y1="160" x2="59" y2="160" stroke="#011a11" stroke-width="1.5" />

  <!-- High-Tech Split Wing Spoiler -->
  <path d="M 12 177 L 46 177 L 44 188 L 14 188 Z" fill="#01170f" stroke="#010d08" stroke-width="1.2" />
  <path d="M 54 177 L 88 177 L 86 188 L 56 188 Z" fill="#01170f" stroke="#010d08" stroke-width="1.2" />
  <line x1="16" y1="180" x2="44" y2="180" stroke="#00e5ff" stroke-width="1.5" />
  <line x1="56" y1="180" x2="84" y2="180" stroke="#00e5ff" stroke-width="1.5" />

  <!-- Cyber Emerald Headlights -->
  <path d="M 20 28 C 22 21, 28 17, 33 22 C 31 29, 24 35, 20 28 Z" fill="#69f0ae" stroke="#00e676" stroke-width="1" filter="url(#nGlow)" />
  <path d="M 80 28 C 78 21, 72 17, 67 22 C 69 29, 76 35, 80 28 Z" fill="#69f0ae" stroke="#00e676" stroke-width="1" filter="url(#nGlow)" />

  <!-- Rear Taillights (Neon Cyber Cyan) -->
  <path d="M 17 190 L 32 190 L 30 194 L 18 194 Z" fill="#00e5ff" filter="url(#nGlow)" />
  <path d="M 68 190 L 83 190 L 82 194 L 70 194 Z" fill="#00e5ff" filter="url(#nGlow)" />
  <line x1="19" y1="192" x2="30" y2="192" stroke="#ffffff" stroke-width="1.5" />
  <line x1="70" y1="192" x2="81" y2="192" stroke="#ffffff" stroke-width="1.5" />

  <!-- Quad Exhausts -->
  <ellipse cx="38" cy="195" rx="3" ry="2" fill="#051410" stroke="#00e5ff" stroke-width="0.8" />
  <ellipse cx="62" cy="195" rx="3" ry="2" fill="#051410" stroke="#00e5ff" stroke-width="0.8" />
</svg>
