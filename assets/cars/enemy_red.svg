<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100%" height="100%">
  <defs>
    <!-- Metallic Red Paint Gradients -->
    <linearGradient id="eBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a0a14" />
      <stop offset="15%" stop-color="#b81424" />
      <stop offset="50%" stop-color="#e82c3c" />
      <stop offset="85%" stop-color="#b81424" />
      <stop offset="100%" stop-color="#7a0a14" />
    </linearGradient>

    <linearGradient id="eRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54050d" />
      <stop offset="50%" stop-color="#8a0c18" />
      <stop offset="100%" stop-color="#40040a" />
    </linearGradient>

    <linearGradient id="eGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140204" />
      <stop offset="35%" stop-color="#300d12" />
      <stop offset="60%" stop-color="#1a0407" />
      <stop offset="100%" stop-color="#0a0102" />
    </linearGradient>

    <filter id="eGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="rotate(180 50 100)">
    <!-- Ground Drop Shadow -->
    <ellipse cx="50" cy="108" rx="42" ry="76" fill="#000000" opacity="0.45" />

    <!-- Tires -->
    <rect x="7" y="38" width="13" height="34" rx="4" fill="#141414" />
    <rect x="80" y="38" width="13" height="34" rx="4" fill="#141414" />
    <rect x="6" y="132" width="14" height="36" rx="4" fill="#141414" />
    <rect x="80" y="132" width="14" height="36" rx="4" fill="#141414" />

    <!-- Tire Treads -->
    <line x1="13" y1="42" x2="13" y2="68" stroke="#2a2a2a" stroke-width="2" />
    <line x1="87" y1="42" x2="87" y2="68" stroke="#2a2a2a" stroke-width="2" />
    <line x1="13" y1="136" x2="13" y2="164" stroke="#2a2a2a" stroke-width="2" />
    <line x1="87" y1="136" x2="87" y2="164" stroke="#2a2a2a" stroke-width="2" />

    <!-- Main Chassis / Outer Silhouette -->
    <path d="M 28 16 
             C 40 13, 60 13, 72 16 
             C 84 19, 87 34, 88 52 
             C 89 68, 86 85, 84 105 
             C 87 122, 91 142, 90 166 
             C 89 184, 81 192, 72 193 
             C 60 194, 40 194, 28 193 
             C 19 192, 11 184, 10 166 
             C 9 142, 13 122, 16 105 
             C 14 85, 11 68, 12 52 
             C 13 34, 16 19, 28 16 Z" 
          fill="url(#eBodyGrad)" stroke="#50040b" stroke-width="1.5" />

    <!-- Hood Indentations & Scoops -->
    <path d="M 34 26 Q 50 34 66 26 Q 50 31 34 26 Z" fill="#4d0309" opacity="0.6" />
    <path d="M 36 38 L 44 56 L 38 58 Z" fill="#5e050d" />
    <path d="M 64 38 L 56 56 L 62 58 Z" fill="#5e050d" />

    <!-- Side Mirrors -->
    <path d="M 12 76 C 5 74, 4 82, 11 86 Z" fill="#9e101d" stroke="#50040b" stroke-width="1" />
    <path d="M 88 76 C 95 74, 96 82, 89 86 Z" fill="#9e101d" stroke="#50040b" stroke-width="1" />

    <!-- Front Windshield -->
    <path d="M 24 66 
             C 36 62, 64 62, 76 66 
             C 79 78, 77 94, 73 103 
             C 62 101, 38 101, 27 103 
             C 23 94, 21 78, 24 66 Z" 
          fill="url(#eGlassGrad)" stroke="#2b0306" stroke-width="1.5" />

    <!-- Windshield Reflection -->
    <path d="M 28 68 Q 42 78 48 98 L 44 99 Q 38 80 26 70 Z" fill="#ffffff" opacity="0.2" />

    <!-- Roof Section -->
    <path d="M 27 103 
             C 38 101, 62 101, 73 103 
             C 74 116, 73 130, 71 141 
             C 60 139, 40 139, 29 141 
             C 27 130, 26 116, 27 103 Z" 
          fill="url(#eRoofGrad)" />

    <rect x="46" y="103" width="8" height="37" fill="#380206" rx="2" />

    <!-- Rear Window -->
    <path d="M 29 141 
             C 40 139, 60 139, 71 141 
             C 72 153, 70 162, 67 167 
             C 58 165, 42 165, 33 167 
             C 30 162, 28 153, 29 141 Z" 
          fill="url(#eGlassGrad)" stroke="#2b0306" stroke-width="1.5" />

    <!-- Rear Spoiler / Wing -->
    <path d="M 12 178 L 88 178 L 86 189 L 14 189 Z" fill="#290205" stroke="#120102" stroke-width="1.2" />
    <path d="M 15 179 L 85 179 L 84 183 L 16 183 Z" fill="#800a14" opacity="0.8" />
    <rect x="32" y="171" width="5" height="11" fill="#120102" />
    <rect x="63" y="171" width="5" height="11" fill="#120102" />

    <!-- Simple, Clean Headlights (No Glowing Light Beams or Halos) -->
    <path d="M 20 28 C 22 23, 27 20, 31 24 C 30 28, 24 32, 20 28 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="0.8" />
    <path d="M 80 28 C 78 23, 73 20, 69 24 C 70 28, 76 32, 80 28 Z" fill="#d7ccc8" stroke="#8d6e63" stroke-width="0.8" />

    <!-- Rear Taillights -->
    <rect x="20" y="190" width="12" height="4" rx="1.5" fill="#c62828" />
    <rect x="68" y="190" width="12" height="4" rx="1.5" fill="#c62828" />

    <!-- Exhaust Tips -->
    <ellipse cx="38" cy="195" rx="3" ry="2" fill="#222" stroke="#444" stroke-width="0.8" />
    <ellipse cx="62" cy="195" rx="3" ry="2" fill="#222" stroke="#444" stroke-width="0.8" />
  </g>
</svg>
