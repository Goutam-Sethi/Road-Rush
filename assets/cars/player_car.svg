<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100%" height="100%">
    <!-- Wheels -->
    <rect x="5" y="30" width="12" height="30" rx="3" fill="#111" />
    <rect x="83" y="30" width="12" height="30" rx="3" fill="#111" />
    <rect x="5" y="140" width="12" height="30" rx="3" fill="#111" />
    <rect x="83" y="140" width="12" height="30" rx="3" fill="#111" />
    
    <!-- Main Body Base (Shadow/Underbody) -->
    <path d="M 15 20 L 85 20 C 95 20, 95 35, 95 50 L 95 180 C 95 195, 85 195, 85 195 L 15 195 C 5 195, 5 195, 5 180 L 5 50 C 5 35, 5 20, 15 20 Z" fill="#0d47a1" />
    
    <!-- Main Car Body -->
    <path d="M 20 15 L 80 15 C 92 15, 90 40, 90 60 L 90 170 C 90 190, 85 195, 80 195 L 20 195 C 15 195, 10 190, 10 170 L 10 60 C 10 40, 8 15, 20 15 Z" fill="#1e88e5" />
    
    <!-- Body Highlights/Contours -->
    <path d="M 25 15 L 75 15 C 80 15, 85 40, 85 60 L 85 160 C 85 180, 80 190, 75 190 L 25 190 C 20 190, 15 180, 15 160 L 15 60 C 15 40, 20 15, 25 15 Z" fill="#2196f3" />
    
    <!-- Racing Stripes -->
    <rect x="42" y="15" width="6" height="180" fill="#ffffff" opacity="0.9" />
    <rect x="52" y="15" width="6" height="180" fill="#ffffff" opacity="0.9" />
    
    <!-- Hood Vents -->
    <path d="M 30 35 L 40 45 L 35 47 Z" fill="#0d47a1" />
    <path d="M 70 35 L 60 45 L 65 47 Z" fill="#0d47a1" />
    
    <!-- Windshield -->
    <path d="M 20 70 L 80 70 C 85 70, 80 90, 75 105 L 25 105 C 20 90, 15 70, 20 70 Z" fill="#1a237e" />
    <path d="M 22 73 L 78 73 C 81 73, 78 88, 73 102 L 27 102 C 22 88, 19 73, 22 73 Z" fill="#283593" />
    
    <!-- Roof -->
    <rect x="27" y="105" width="46" height="35" fill="#1e88e5" />
    <rect x="42" y="105" width="16" height="35" fill="#ffffff" opacity="0.9" />
    
    <!-- Rear Window -->
    <path d="M 27 140 L 73 140 L 75 160 L 25 160 Z" fill="#1a237e" />
    <path d="M 30 142 L 70 142 L 71 157 L 29 157 Z" fill="#283593" />
    
    <!-- Spoiler -->
    <path d="M 12 180 L 88 180 L 92 192 L 8 192 Z" fill="#111111" />
    <!-- Spoiler Mounts -->
    <rect x="30" y="170" width="4" height="15" fill="#111" />
    <rect x="66" y="170" width="4" height="15" fill="#111" />
    
    <!-- Headlights -->
    <path d="M 15 25 L 30 15 L 35 28 L 18 35 Z" fill="#e3f2fd" />
    <path d="M 85 25 L 70 15 L 65 28 L 82 35 Z" fill="#e3f2fd" />
    <!-- Headlight glow -->
    <path d="M 17 25 L 28 18 L 32 26 L 19 32 Z" fill="#ffffff" />
    <path d="M 83 25 L 72 18 L 68 26 L 81 32 Z" fill="#ffffff" />
    
    <!-- Taillights -->
    <rect x="15" y="190" width="20" height="5" rx="2" fill="#ff1744" />
    <rect x="65" y="190" width="20" height="5" rx="2" fill="#ff1744" />
    
    <!-- Mirrors -->
    <path d="M 8 85 L 18 80 L 16 95 Z" fill="#1e88e5" />
    <path d="M 92 85 L 82 80 L 84 95 Z" fill="#1e88e5" />
</svg>
