<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100%" height="100%">
  <defs>
    <!-- Crimson Paint Gradients -->
    <linearGradient id="cBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#660505" />
      <stop offset="15%" stop-color="#aa0c0c" />
      <stop offset="50%" stop-color="#e51a1a" />
      <stop offset="85%" stop-color="#aa0c0c" />
      <stop offset="100%" stop-color="#660505" />
    </linearGradient>

    <linearGradient id="cRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d0505" />
      <stop offset="50%" stop-color="#880808" />
      <stop offset="100%" stop-color="#3d0303" />
    </linearGradient>

    <linearGradient id="cGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140202" />
      <stop offset="35%" stop-color="#3d0a0a" />
      <stop offset="60%" stop-color="#240505" />
      <stop offset="100%" stop-color="#120202" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="cGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Drop Shadow -->
  <ellipse cx="50" cy="108" rx="42" ry="76" fill="#000000" opacity="0.6" />

  <!-- Tires -->
  <rect x="7" y="38" width="13" height="34" rx="4" fill="#141414" />
  <rect x="80" y="38" width="13" height="34" rx="4" fill="#141414" />
  <rect x="6" y="132" width="14" height="36" rx="4" fill="#141414" />
  <rect x="80" y="132" width="14" height="36" rx="4" fill="#141414" />

  <!-- Tire Rims (Gold/Red calipers) -->
  <line x1="13" y1="42" x2="13" y2="68" stroke="#ffab00" stroke-width="2" />
  <line x1="87" y1="42" x2="87" y2="68" stroke="#ffab00" stroke-width="2" />
  <line x1="13" y1="136" x2="13" y2="164" stroke="#ffab00" stroke-width="2" />
  <line x1="87" y1="136" x2="87" y2="164" stroke="#ffab00" stroke-width="2" />

  <!-- Main Chassis / Outer Silhouette -->
  <path d="M 28 16 
           C 40 13, 60 13, 72 16 
           C 84 19, 87 34, 88 52 
           C 89 68, 86 85, 84 105 
           C 87 122, 91 142, 90 166 
           C 89 184, 81 192, 72 193 
           C 60 194, 40 194, 28 193 
           C 19 192, 11 184, 10 166 
           C 9 142, 13 122, 16 105 
           C 14 85, 11 68, 12 52 
           C 13 34, 16 19, 28 16 Z" 
        fill="url(#cBodyGrad)" stroke="#420404" stroke-width="1.5" />

  <!-- Dual Racing Stripes (Golden Yellow) -->
  <path d="M 46 16 L 46 193 L 48 193 L 48 16 Z" fill="#ffcc00" opacity="0.85" />
  <path d="M 52 16 L 52 193 L 54 193 L 54 16 Z" fill="#ffcc00" opacity="0.85" />

  <!-- Aerodynamic Hood Indentations & Vents -->
  <path d="M 34 26 Q 50 34 66 26 Q 50 31 34 26 Z" fill="#380303" opacity="0.75" />
  <path d="M 36 38 L 43 58 L 38 60 Z" fill="#2d0202" />
  <path d="M 64 38 L 57 58 L 62 60 Z" fill="#2d0202" />

  <!-- Hood Center Specular Crease -->
  <line x1="50" y1="20" x2="50" y2="64" stroke="#ff8a80" stroke-width="1.2" opacity="0.6" />

  <!-- Side Mirrors -->
  <path d="M 12 76 C 5 74, 4 82, 11 86 Z" fill="#880808" stroke="#3d0303" stroke-width="1" />
  <path d="M 88 76 C 95 74, 96 82, 89 86 Z" fill="#880808" stroke="#3d0303" stroke-width="1" />

  <!-- Front Windshield -->
  <path d="M 24 66 
           C 36 62, 64 62, 76 66 
           C 79 78, 77 94, 73 103 
           C 62 101, 38 101, 27 103 
           C 23 94, 21 78, 24 66 Z" 
        fill="url(#cGlassGrad)" stroke="#2d0404" stroke-width="1.5" />

  <!-- Windshield Reflection Glint -->
  <path d="M 28 68 Q 42 78 48 98 L 44 99 Q 38 80 26 70 Z" fill="#ffffff" opacity="0.35" />

  <!-- Roof Section -->
  <path d="M 27 103 
           C 38 101, 62 101, 73 103 
           C 74 116, 73 130, 71 141 
           C 60 139, 40 139, 29 141 
           C 27 130, 26 116, 27 103 Z" 
        fill="url(#cRoofGrad)" />

  <!-- Roof Central Scoop -->
  <rect x="44" y="102" width="12" height="38" fill="#1f0202" rx="2" />
  <line x1="50" y1="104" x2="50" y2="139" stroke="#ffab00" stroke-width="1.5" opacity="0.8" />

  <!-- Rear Window -->
  <path d="M 29 141 
           C 40 139, 60 139, 71 141 
           C 72 153, 70 162, 67 167 
           C 58 165, 42 165, 33 167 
           C 30 162, 28 153, 29 141 Z" 
        fill="url(#cGlassGrad)" stroke="#2d0404" stroke-width="1.5" />

  <!-- Engine Heat Dissipation Slats -->
  <line x1="38" y1="148" x2="62" y2="148" stroke="#110101" stroke-width="1.8" />
  <line x1="39" y1="154" x2="61" y2="154" stroke="#110101" stroke-width="1.8" />
  <line x1="41" y1="160" x2="59" y2="160" stroke="#110101" stroke-width="1.8" />

  <!-- Aggressive GT Wing / Spoiler -->
  <path d="M 10 176 L 90 176 L 87 190 L 13 190 Z" fill="#140202" stroke="#080101" stroke-width="1.5" />
  <path d="M 14 178 L 86 178 L 84 182 L 16 182 Z" fill="#e51a1a" opacity="0.9" />
  <!-- Spoiler Mounts -->
  <rect x="30" y="170" width="6" height="12" fill="#050101" />
  <rect x="64" y="170" width="6" height="12" fill="#050101" />

  <!-- Aggressive Headlights (Fierce Golden-Amber) -->
  <path d="M 20 28 C 22 21, 28 17, 33 22 C 31 29, 24 35, 20 28 Z" fill="#ffe082" stroke="#ffb300" stroke-width="1" />
  <path d="M 80 28 C 78 21, 72 17, 67 22 C 69 29, 76 35, 80 28 Z" fill="#ffe082" stroke="#ffb300" stroke-width="1" />

  <!-- Rear Taillights (Neon Glow Red) -->
  <path d="M 17 190 L 32 190 L 30 194 L 18 194 Z" fill="#ff1744" filter="url(#cGlow)" />
  <path d="M 68 190 L 83 190 L 82 194 L 70 194 Z" fill="#ff1744" filter="url(#cGlow)" />
  <line x1="19" y1="192" x2="30" y2="192" stroke="#ffffff" stroke-width="1.5" />
  <line x1="70" y1="192" x2="81" y2="192" stroke="#ffffff" stroke-width="1.5" />

  <!-- Dual Quad Exhaust Pipes -->
  <ellipse cx="36" cy="195" rx="3.5" ry="2" fill="#1a1a1a" stroke="#ffab00" stroke-width="0.8" />
  <ellipse cx="64" cy="195" rx="3.5" ry="2" fill="#1a1a1a" stroke="#ffab00" stroke-width="0.8" />
</svg>
